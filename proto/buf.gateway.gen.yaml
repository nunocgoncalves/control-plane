# Codegen for the tool-gateway RPC contract (HOR-392). Generates:
#   - Go stubs -> internal/gatewayrpc/iterabase/gateway/v1
#     (consumed by internal/gateway + the Go reference runner; HOR-397's Node
#     runner will add TypeScript stubs later under harness/src/gen).
#
# paths=source_relative places each generated file next to its .proto source
# under `out`. The Makefile `proto` target restricts this template to the
# gateway proto via `buf generate --template buf.gateway.gen.yaml --path
# iterabase/gateway`.
#
# Local protoc plugins (install via `make proto-tools`). Run `make proto`.
version: v2
managed:
  enabled: true
plugins:
  - local: protoc-gen-go
    out: ../internal/gatewayrpc
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: ../internal/gatewayrpc
    opt: paths=source_relative
